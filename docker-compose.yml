name: lexground

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lexground
      POSTGRES_PASSWORD: lexground
      POSTGRES_DB: lexground
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexground -d lexground"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      LEXGROUND_DATABASE_URL: postgresql+asyncpg://lexground:lexground@db:5432/lexground
      LEXGROUND_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEXGROUND_EMBEDDING_BACKEND: ${LEXGROUND_EMBEDDING_BACKEND:-hash}
      LEXGROUND_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
